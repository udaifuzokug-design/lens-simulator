<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>凸レンズ実験シミュレーター</title><style>body{font-family:system-ui,'Noto Sans JP',sans-serif;background:#f2f6fb;color:#183047;margin:0;padding:16px}.app{max-width:960px;margin:auto;background:white;padding:20px;border-radius:18px;box-shadow:0 6px 25px #18304718}h1{font-size:1.5rem;margin:0 0 6px}.sub{color:#607589;margin:0 0 20px}.row{margin:15px 0}.label{font-weight:700;margin-bottom:8px}.choices{display:flex;flex-wrap:wrap;gap:9px}button{border:1px solid #b7c9db;background:#f8fbff;border-radius:11px;padding:10px 16px;font-size:17px;cursor:pointer;touch-action:manipulation}button.selected{background:#1269b5;color:white;border-color:#1269b5}.object{min-width:65px;font-size:26px;font-weight:800}input[type=range]{width:100%;accent-color:#1269b5;touch-action:pan-y}.rangeLine{display:flex;justify-content:space-between;align-items:center;gap:12px}.value{font-weight:800;color:#1269b5;white-space:nowrap}svg{width:100%;height:auto;display:block;background:#fbfdff;border:1px solid #dce6f0;border-radius:12px;touch-action:none}.checks{display:flex;flex-wrap:wrap;gap:20px;margin:14px 0}.checks label{cursor:pointer}.screenbox{background:#172b42;color:white;border-radius:14px;padding:15px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}.screenpreview{width:130px;height:130px;background:#273f58;border:3px solid #8096ab;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}.status{flex:1;min-width:200px;line-height:1.7}.foot{font-size:13px;color:#607589;margin-top:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.actions button:first-child{background:#1269b5;color:white}.objectSymbol{font-family:Arial,sans-serif;font-weight:900}</style></head><body><main class="app"><h1>凸レンズ実験シミュレーター</h1><p class="sub">物体・凸レンズ・スクリーンを動かして、像のでき方を調べよう</p><section class="row"><div class="label">① 物体を選ぶ（タッチ式）</div><div id="objects" class="choices"><button class="object selected" data-obj="arrow">↑</button><button class="object" data-obj="F">F</button><button class="object" data-obj="4">4</button><button class="object" data-obj="branch">├</button><button class="object" data-obj="apple" aria-label="葉っぱ付きリンゴ" title="葉っぱ付きリンゴ"><svg viewBox="0 0 60 60" style="width:42px;height:42px;border:0;background:transparent;display:inline-block;vertical-align:middle" aria-hidden="true"><path d="M30 18 C15 7 6 23 11 40 C15 56 24 57 30 53 C36 57 45 56 49 40 C54 23 45 7 30 18Z" fill="#e94c52" stroke="#b52c35" stroke-width="2"/><path d="M30 19 L33 9" stroke="#795548" stroke-width="3" stroke-linecap="round"/><path d="M33 11 Q47 2 49 12 Q41 19 33 11Z" fill="#48a56b" stroke="#267447" stroke-width="1.5"/></svg></button></div></section><section class="row"><div class="label">② 凸レンズを選ぶ</div><div class="choices" id="lenses"><button data-f="5">A：厚い（f=5cm）</button><button class="selected" data-f="10">B：標準（f=10cm）</button><button data-f="15">C：薄い（f=15cm）</button></div></section><section class="row"><div class="label">③ 物体の位置を変える</div><div class="rangeLine"><span>物体とレンズの距離</span><span id="uval" class="value">30 cm</span></div><input id="u" type="range" min="3" max="40" step="0.5" value="30"><div class="choices"><button data-pos="3">2Fより遠い</button><button data-pos="2">2Fの位置</button><button data-pos="1.5">Fと2Fの間</button><button data-pos="1">焦点F</button><button data-pos="0.5">焦点の内側</button></div></section><div class="checks"><label><input type="checkbox" id="rays" checked> 光線を表示</label><label><input type="checkbox" id="image" checked> 像を表示</label><label><input type="checkbox" id="screenOn" checked> スクリーンを使用</label></div><svg id="diagram" viewBox="0 0 900 380" aria-label="凸レンズの光線図"><g id="draw"></g></svg><section class="row"><div class="label">④ スクリーンを動かしてピントを合わせる</div><div class="rangeLine"><span>レンズからスクリーンまでの距離</span><span class="value" id="sval">15 cm</span></div><input id="screen" type="range" min="1" max="60" step="0.5" value="15"></section><div class="screenbox"><div class="screenpreview" id="preview"></div><div class="status" id="status"></div></div><div class="actions"><button id="check">像のでき方を確認する</button><button id="reset">初期状態に戻す</button></div><div class="foot">物体の根元・レンズの中心は光軸（y=0）上です。図の物体とスクリーンはドラッグでも動かせます。レンズの厚さと焦点距離の関係は教材用のモデルです。</div></main><script>
const $=id=>document.getElementById(id);let obj='arrow',f=10,u=30,s=15,showResult=false;const C=430,Y=190,K=8;const fmt=x=>Number.isFinite(x)?(Math.round(x*10)/10).toString():'∞';const sx=x=>C+x*K,sy=y=>Y-y*K;function symbol(kind,x,base,height,color,inverted=false){let H=height;let a=`<g transform="translate(${x} ${base}) ${inverted?'rotate(180)':''}" fill="${color}" stroke="${color}" stroke-linejoin="round">`;if(kind==='arrow')a+=`<path d="M0 0 V-${H-12} M-10 -${H-24} L0 -${H} L10 -${H-24}" stroke-width="5" fill="none"/>`;else if(kind==='apple')a+=`<path d="M0 -${H*.77} C-${H*.25} -${H*.99} -${H*.43} -${H*.72} -${H*.34} -${H*.38} C-${H*.28} -${H*.09} -${H*.11} 0 0 -${H*.05} C${H*.11} 0 ${H*.28} -${H*.09} ${H*.34} -${H*.38} C${H*.43} -${H*.72} ${H*.25} -${H*.99} 0 -${H*.77}Z" fill="#e94c52" stroke="#b52c35" stroke-width="${Math.max(1,H*.025)}"/><path d="M0 -${H*.77} L${H*.05} -${H*.98}" fill="none" stroke="#795548" stroke-width="${Math.max(2,H*.055)}"/><path d="M${H*.05} -${H*.94} Q${H*.29} -${H*1.15} ${H*.37} -${H*.94} Q${H*.23} -${H*.81} ${H*.05} -${H*.94}Z" fill="#48a56b" stroke="#267447" stroke-width="${Math.max(1,H*.018)}"/>`;else if(kind==='branch')a+=`<path d="M0 0 V-${H} M0 -${H*.62} H${H*.38}" stroke-width="7" fill="none"/>`;else a+=`<text x="0" y="0" font-family="Arial,sans-serif" font-weight="900" font-size="${H}" text-anchor="middle" dominant-baseline="text-after-edge" stroke="none">${kind}</text>`;return a+'</g>'}function line(x1,y1,x2,y2,color,dash=''){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="2.4" ${dash?'stroke-dasharray="6 5"':''}/>`}function render(){u=+$('u').value;s=+$('screen').value;$('uval').textContent=fmt(u)+' cm';$('sval').textContent=fmt(s)+' cm';const v=Math.abs(u-f)<1e-8?Infinity:f*u/(u-f),real=v>0&&Number.isFinite(v),virtual=v<0,m=Number.isFinite(v)?-v/u:Infinity;let h=7.5,H=h*K;let d=`<line x1="15" y1="${Y}" x2="885" y2="${Y}" stroke="#74869b" stroke-width="2"/><text x="18" y="${Y+20}" fill="#74869b" font-size="14">y=0</text>`;let curve=f===5?18:f===10?13:8;d+=`<path d="M${C} 48 Q${C+curve*2} ${Y} ${C} 332 Q${C-curve*2} ${Y} ${C} 48Z" fill="#9bd9f3" fill-opacity=".55" stroke="#3388b5" stroke-width="2"/><circle cx="${C}" cy="${Y}" r="4" fill="#1269b5"/>`;for(const t of [-2,-1,1,2]){let x=sx(t*f);if(x>15&&x<885)d+=`<path d="M${x} ${Y-7}v14" stroke="#8494a8" stroke-width="2"/><text x="${x}" y="${Y+24}" font-size="13" text-anchor="middle" fill="#607589">${Math.abs(t)===1?'F':'2F'}</text>`}let ox=sx(-u),top=sy(h);d+=symbol(obj,ox,Y,H,'#2375c6');d+=`<circle cx="${ox}" cy="${Y}" r="5" fill="#2375c6"/>`;if($('rays').checked){let xend=880;d+=line(ox,top,C,top,'#e98b2e');d+=line(C,top,xend,top+(xend-C)*(H/(f*K)),'#e98b2e');d+=line(ox,top,xend,Y+(xend-C)*(H/(u*K)),'#27a075');if(virtual){let xleft=Math.max(15,sx(v));d+=line(xleft,top+(xleft-C)*(H/(f*K)),C,top,'#e98b2e',true);d+=line(xleft,Y+(xleft-C)*(H/(u*K)),C,Y,'#27a075',true)}}if($('image').checked&&Number.isFinite(v)&&sx(v)>15&&sx(v)<885){let ih=Math.min(Math.abs(m)*H,650);d+=symbol(obj,sx(v),Y,ih,real?'#d34e61':'#a64ac9',real);d+=`<circle cx="${sx(v)}" cy="${Y}" r="4" fill="${real?'#d34e61':'#a64ac9'}"/>`}if($('screenOn').checked){let x=sx(s);if(x<885)d+=`<rect x="${x-4}" y="40" width="8" height="290" rx="3" fill="#687a90" fill-opacity=".75"/><text x="${x}" y="30" font-size="13" text-anchor="middle" fill="#52647a">スクリーン</text>`}d+=`<text x="${C}" y="355" font-size="14" text-anchor="middle" fill="#607589">凸レンズ（中心 x=0, y=0）</text>`;$('draw').innerHTML=d;let focus=real&&Math.abs(s-v)<=0.75;let content='';if(!$('screenOn').checked)content='<span style="color:#aebdcb">スクリーンを使用していません</span>';else if(!real)content='<span style="color:#aebdcb">スクリーンに像は映りません</span>';else{let blur=Math.min(12,Math.abs(s-v)*.8);let hh=Math.max(15,Math.min(90,Math.abs(m)*45));content=obj==='apple'?`<svg viewBox="0 0 120 130" style="width:${Math.min(105,hh*1.05)}px;height:${Math.min(114,hh*1.15)}px;filter:blur(${blur}px);opacity:${Math.max(.2,1-blur/17)};background:transparent;border:0"><g transform="translate(60 15) rotate(180)"><path d="M0 -72 C-24 -93 -42 -68 -34 -37 C-28 -10 -11 0 0 -5 C11 0 28 -10 34 -37 C42 -68 24 -93 0 -72Z" fill="#e94c52" stroke="#b52c35" stroke-width="2"/><path d="M0 -72 L5 -95" stroke="#795548" stroke-width="4"/><path d="M5 -91 Q28 -112 37 -91 Q23 -78 5 -91Z" fill="#48a56b" stroke="#267447" stroke-width="2"/></g></svg>`:`<div style="filter:blur(${blur}px);opacity:${Math.max(.2,1-blur/17)};transform:rotate(180deg);color:#ffd86c;font-weight:900;font-family:Arial,sans-serif;font-size:${hh}px;line-height:1">${obj==='arrow'?'↑':obj==='branch'?'├':obj}</div>`} $('preview').innerHTML=content;let status=focus?'スクリーンに鮮明な倒立像が映っています。':real?'スクリーンを動かして、像が鮮明になる位置を探そう。':'この位置ではスクリーンに実像ができません。';if(showResult){status+=`<br><b>観察結果：</b>${!Number.isFinite(v)?'焦点上：像は遠方にできる。':real?'実像・倒立':'虚像・正立'}／像の距離 ${fmt(Math.abs(v))} cm／倍率 ${fmt(Math.abs(m))} 倍`;} $('status').innerHTML=status;}
$('objects').onclick=e=>{let b=e.target.closest('button[data-obj]');if(!b)return;obj=b.dataset.obj;document.querySelectorAll('#objects button').forEach(x=>x.classList.toggle('selected',x===b));render()};$('lenses').onclick=e=>{let b=e.target.closest('button[data-f]');if(!b)return;f=+b.dataset.f;document.querySelectorAll('#lenses button').forEach(x=>x.classList.toggle('selected',x===b));render()};document.querySelectorAll('[data-pos]').forEach(b=>b.onclick=()=>{$('u').value=Math.max(3,Math.min(40,Math.round(f*+b.dataset.pos*2)/2));render()});['u','screen','rays','image','screenOn'].forEach(id=>$(id).addEventListener('input',render));$('check').onclick=()=>{showResult=true;render()};$('reset').onclick=()=>{obj='arrow';f=10;$('u').value=30;$('screen').value=15;showResult=false;['rays','image','screenOn'].forEach(id=>$(id).checked=true);document.querySelectorAll('#objects button').forEach(b=>b.classList.toggle('selected',b.dataset.obj==='arrow'));document.querySelectorAll('#lenses button').forEach(b=>b.classList.toggle('selected',b.dataset.f==='10'));render()};let drag=null;const svg=$('diagram');svg.addEventListener('pointerdown',e=>{let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;let q=p.matrixTransform(svg.getScreenCTM().inverse());if(Math.abs(q.x-sx(-u))<25)drag='u';else if(Math.abs(q.x-sx(s))<25)drag='screen';if(drag)svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!drag)return;let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;let q=p.matrixTransform(svg.getScreenCTM().inverse());let val=drag==='u'?(C-q.x)/K:(q.x-C)/K;let el=$(drag);el.value=Math.max(+el.min,Math.min(+el.max,Math.round(val*2)/2));render()});svg.addEventListener('pointerup',()=>drag=null);svg.addEventListener('pointercancel',()=>drag=null);render();
</script></body></html>
